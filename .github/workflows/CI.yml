name: CI push

# Trigger: build on push to main and on pull requests targeting main
on:
    push:

jobs:
    build:
        name: Build Docker images
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
                uses: actions/checkout@v4

            - name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v2

            - name: Build exo2 image (backend Java app)
                uses: docker/build-push-action@v5
                with:
                    context: ./exo2
                    file: ./exo2/Dockerfile
                    platforms: linux/amd64,linux/arm64
                    push: false
                    # Use commit SHA for stable, event-agnostic tagging (optional)
                    # tags can be added if you later want to push the image

            - name: Check required secrets and variables
                run: |
                    echo "Checking required secrets/variables..."
                    if [ -z "${{ secrets.DB_USER }}" ]; then echo "Missing secret: DB_USER"; exit 1; fi
                    if [ -z "${{ secrets.DB_PASSWORD }}" ]; then echo "Missing secret: DB_PASSWORD"; exit 1; fi
                    if [ -z "${{ secrets.DB_NAME }}" ]; then echo "Missing secret: DB_NAME"; exit 1; fi
                    if [ -z "${{ vars.DB_PORT }}" ]; then echo "Note: DB_PORT variable not set, defaulting to 5432"; fi
                    if [ -z "${{ vars.BACKEND_PORT }}" ]; then echo "Note: BACKEND_PORT variable not set, defaulting to 8080"; fi

            - name: Create .env for docker-compose (from GitHub Secrets & Variables)
                run: |
                    echo "Writing ./exo2/.env from repository secrets/vars"
                    cat > ./exo2/.env <<EOF
                    DB_USER=${{ secrets.DB_USER }}
                    DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                    DB_NAME=${{ secrets.DB_NAME }}
                    DB_PORT=${{ vars.DB_PORT }}
                    BACKEND_PORT=${{ vars.BACKEND_PORT }}
                    EOF

            - name: Validate docker-compose file for exo2
                run: |
                    echo "Validating docker-compose at ./exo2/docker-compose.yml"
                    docker compose -f ./exo2/docker-compose.yml config

            - name: Build with docker-compose for exo2 (verify)
                run: |
                    echo "Building services defined in ./exo2/docker-compose.yml"
                    # Build only, do not start containers
                    docker compose -f ./exo2/docker-compose.yml build --progress=plain
